# Pod.AI — standalone Shopify app (App Store candidate). Separate Partner app from "POD Wedding Studio".
# Dev Dashboard: org DropkingAI, app "Pod.AI" (id 443599257601). Deploy: cd apps/shopify-agent && shopify app deploy
client_id = "46d75edb5ea4339d6f66ef87e28ab37d"
name = "Pod.AI"
application_url = "https://pod.swisspro.site/shopify-agent"
# Primary host: pod.swisspro.site. The same Node app still serves /shopify-agent on wed.swisspro.site during the switch.
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# read_orders: order status in chat (protected customer data: e-mail, Level 2 request needed)
# read_products: products, variants, collections, metafields · read_shipping: delivery profiles/zones/rates
# read_discounts: check a code the customer has (read-only) · read_legal_policies: refund / shipping / contact policies
scopes = "read_products,read_orders,read_shipping,read_discounts,read_legal_policies"

use_legacy_install_flow = false

[auth]
# Shopify-managed install + token exchange: no OAuth callback route is used.
redirect_urls = [ "https://pod.swisspro.site/shopify-agent" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://pod.swisspro.site/shopify-agent/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://pod.swisspro.site/shopify-agent/webhooks"

[app_proxy]
url = "https://pod.swisspro.site/shopify-agent/proxy"
subpath = "podai"
prefix = "apps"

[pos]
embedded = false
