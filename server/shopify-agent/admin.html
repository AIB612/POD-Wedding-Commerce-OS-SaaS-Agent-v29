<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="shopify-api-key" content="__API_KEY__">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<title>Pod.AI</title>
<style>
/* POD.AI design tokens (wed.swisspro.site / agent.html): warm ink + gold, glass cards, Inter + Georgia, pill controls */
:root{--bg:#f6f0e8;--ink:#241f1b;--ink2:#5d5249;--mut:#8a7e74;--gold:#b8865b;--gold2:#8a5a33;--card:rgba(255,253,249,.78);--line:rgba(45,36,30,.1);--r:20px;
--ok:#2f7d5b;--okb:#e3f2ea;--warn:#9a6a16;--warnb:#fbefd6;--bad:#a8402f;--badb:#f8e3de;--info:#5e4533;--infob:#efe6dc;--grad:linear-gradient(135deg,#2b2520,#5e4533)}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 420px at 85% -10%,rgba(184,134,91,.16),transparent 60%),radial-gradient(700px 380px at -10% 10%,rgba(255,255,255,.7),transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 15px Inter;box-shadow:0 8px 20px rgba(43,37,32,.25)}
.brand b{display:block;font:500 21px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em}.brand small{color:var(--mut);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3aa776;margin-right:6px;box-shadow:0 0 0 3px rgba(58,167,118,.18)}
.sp{flex:1}
.seg{display:inline-flex;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:600 12.5px Inter;color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 18px;padding:4px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%;scrollbar-width:none}
nav.tabs button{border:0;background:none;font:600 13px Inter;color:var(--ink2);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(43,37,32,.22)}
nav.tabs .n{background:var(--gold);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 14px 40px rgba(70,48,30,.08);border-radius:var(--r)}
.card{padding:18px 20px;margin-bottom:16px}
h2{font:500 18px/1.2 Georgia,serif;margin:0 0 4px}h3{font:600 13px Inter;margin:0 0 12px;color:var(--ink2);letter-spacing:.02em;text-transform:uppercase}
.mut{color:var(--mut)}.small{font-size:12px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.hd h2{margin:0;font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px 12px;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font:500 32px/1.1 Georgia,serif;margin:8px 0 2px;letter-spacing:-.02em}.kpi .v small{font:600 14px Inter;color:var(--mut);margin-left:2px}
.kpi .s{font-size:12px;color:var(--mut);min-height:18px}
.kpi>svg{display:block;width:100%;height:38px;margin-top:auto}
.tr{font:700 11.5px Inter;border-radius:999px;padding:2px 8px;margin-left:auto}.tr.up{background:var(--okb);color:var(--ok)}.tr.dn{background:var(--badb);color:var(--bad)}.tr.fl{background:var(--infob);color:var(--info)}
.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.bar{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.bar i{display:block;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--gold),#d9b48e)}.bar .t{background:rgba(45,36,30,.06);border-radius:99px}
.heat{display:grid;grid-template-columns:28px repeat(24,1fr);gap:3px;font-size:10px;color:var(--mut)}
.heat b{aspect-ratio:1;border-radius:4px;background:rgba(184,134,91,var(--a));display:block}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.list li:first-child{border-top:0}
.list .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 16px;font:700 13px Inter;border:0;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(43,37,32,.2);text-decoration:none;white-space:nowrap}
.btn.s{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid rgba(45,36,30,.14);box-shadow:none}.btn.xs{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 11.5px Inter;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-open,.b-warn{background:var(--warnb);color:var(--warn)}.b-in_progress,.b-info{background:var(--infob);color:var(--info)}.b-resolved,.b-ok{background:var(--okb);color:var(--ok)}.b-bad{background:var(--badb);color:var(--bad)}
.ex{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--warnb);color:var(--warn);font-weight:600;font-size:13px;margin-bottom:14px}
.check{list-style:none;margin:0;padding:0}.check li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.check li:first-child{border-top:0}
.check .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px dashed rgba(45,36,30,.3)}.check .c.ok{background:var(--ok);border:0;color:#fff}.check .c.w{background:var(--warnb);border:0;color:var(--warn)}
.check .tx{flex:1}.check .tx b{display:block;font-size:13.5px}.check .tx span{font-size:12.5px;color:var(--mut)}
.prog{height:6px;border-radius:99px;background:rgba(45,36,30,.08);overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
table{width:100%;border-collapse:separate;border-spacing:0}th{font:600 11.5px Inter;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}tr:last-child td{border-bottom:0}tbody tr:hover td{background:rgba(255,255,255,.55)}
.clip{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select,input,textarea{font:14px Inter;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid rgba(45,36,30,.16);border-radius:12px;padding:9px 12px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,91,.18)}
td select{width:auto;padding:5px 10px;border-radius:999px;font-size:12.5px}
label.f{display:block;font:600 12.5px Inter;color:var(--ink2);margin:0 0 14px}label.f>span{display:block;margin-bottom:6px}label.f small{font-weight:400;color:var(--mut)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.sw{display:flex;gap:8px;align-items:center}.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw input[type=color]{width:40px;height:32px;padding:2px;border-radius:10px}
.tog{position:relative;width:42px;height:24px;flex:none}.tog input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.tog i{position:absolute;inset:0;border-radius:99px;background:rgba(45,36,30,.18);transition:.2s}
.tog i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.tog input:checked+i{background:var(--ink)}.tog input:checked+i:after{transform:translateX(18px)}
.line{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.line:first-of-type{border-top:0}.line .tx{flex:1}.line .tx b{display:block;font-size:13.5px}.line .tx span{font-size:12.5px;color:var(--mut)}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}.empty b{display:block;color:var(--ink);font:500 17px Georgia,serif;margin-bottom:4px}
dialog{border:0;padding:0;border-radius:22px;width:min(560px,94vw);background:#fffdf9;box-shadow:0 30px 80px rgba(40,28,18,.3)}dialog::backdrop{background:rgba(36,31,27,.35);backdrop-filter:blur(3px)}
dialog .in{padding:22px}dialog .ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:rgba(246,240,232,.5);border-radius:0 0 22px 22px}
/* Try-it: storefront-like chat */
.phone{max-width:390px;margin:0 auto;border-radius:30px;background:#fff;border:1px solid var(--line);box-shadow:0 30px 70px rgba(40,28,18,.18);overflow:hidden;display:flex;flex-direction:column;height:620px}
.ph-h{display:flex;gap:10px;align-items:center;padding:14px 16px;color:#fff;background:var(--acc,#2b2520)}.ph-h .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700}
.ph-h small{display:block;opacity:.75;font-size:11.5px}
.ph-log{flex:1;overflow:auto;padding:14px;background:#faf8f5;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:9px 13px;border-radius:16px;font-size:13.5px;white-space:pre-wrap;line-height:1.45;animation:in .25s ease}.m.a{background:#fff;border:1px solid #eee;border-bottom-left-radius:5px}.m.u{align-self:flex-end;color:#fff;background:var(--acc,#2b2520);border-bottom-right-radius:5px}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid rgba(45,36,30,.18);background:#fff;border-radius:999px;padding:6px 11px;font:600 12px Inter;cursor:pointer;color:var(--ink)}
.car{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.pc{flex:0 0 140px;scroll-snap-align:start;background:#fff;border:1px solid #eee;border-radius:14px;overflow:hidden;font-size:12.5px}
.pc img,.pc .ph{width:100%;aspect-ratio:1;object-fit:cover;background:#f1ece6;display:block}.pc div{padding:8px}.pc b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc{background:#fff;border:1px solid #eee;border-radius:14px;padding:12px;font-size:12.5px}.tl{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid #eee}.tl li{position:relative;margin:0 0 8px}.tl li:before{content:"";position:absolute;left:-19px;top:4px;width:8px;height:8px;border-radius:50%;background:#ccc}.tl li:first-child:before{background:var(--gold)}
.ph-in{display:flex;gap:8px;padding:10px;border-top:1px solid #eee}.ph-in input{border-radius:999px}
.ty{display:flex;gap:4px;padding:12px 14px;background:#fff;border:1px solid #eee;border-radius:16px;width:max-content}.ty i{width:6px;height:6px;border-radius:50%;background:#bbb;animation:b 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
.hide{display:none!important}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px 12px 40px}.kpis{grid-template-columns:1fr}.kpi{min-height:0}.bar{grid-template-columns:100px 1fr 32px}.clip{max-width:150px}.hm-wrap{overflow-x:auto}.heat{min-width:520px}
 table.idx thead{display:none}table.idx tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}table.idx td{border:0;padding:0}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="mark">P</div><div class="brand"><b>Pod.AI</b><small id="shop"><span class="dot"></span>…</small></div><div class="sp"></div>
 <div class="seg" id="lang" aria-label="Language"><button data-l="en" class="on">EN</button><button data-l="de">DE</button><button data-l="fr">FR</button><button data-l="it">IT</button></div></div>
<nav class="tabs" id="tabs" role="tablist"></nav>

<section id="overview">
 <div class="hd"><h2 data-i="ov.h"></h2><span class="mut small" id="ovsub"></span><div class="sp"></div><div class="seg" id="range"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></div></div>
 <div class="ex hide" id="exbar"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span data-i="ex"></span></div>
 <div class="kpis" id="kpis"></div>
 <div class="g2">
  <div class="glass card"><h3 data-i="ov.intents"></h3><div id="intents"></div></div>
  <div class="glass card"><div class="hd" style="margin-bottom:6px"><h3 style="margin:0" data-i="ov.unans"></h3></div><ul class="list" id="unans"></ul></div>
 </div>
 <div class="g2">
  <div class="glass card"><h3 data-i="ov.heat"></h3><div class="hm-wrap"><div class="heat" id="heat"></div></div></div>
  <div class="glass card"><h3 data-i="ov.sla"></h3><div id="sla"></div></div>
 </div>
 <div class="g2">
  <div class="glass card" id="setupCard"><div class="hd" style="margin-bottom:4px"><h3 style="margin:0" data-i="ck.h"></h3><div class="sp"></div><span class="small mut" id="ckn"></span></div><div class="prog"><i id="ckp" style="width:0"></i></div><ul class="check" id="check"></ul></div>
  <div class="glass card"><h3 data-i="ov.tech"></h3><div id="tech"></div></div>
 </div>
</section>

<section id="handoffs" class="hide"><div class="glass card">
 <div class="hd"><h2 data-i="ho.h"></h2><div class="sp"></div><div class="seg" id="hof"><button data-s="" class="on" data-i="all"></button><button data-s="open" data-i="st.open"></button><button data-s="in_progress" data-i="st.in_progress"></button><button data-s="resolved" data-i="st.resolved"></button></div></div>
 <table class="idx"><thead><tr><th data-i="ho.c1"></th><th data-i="ho.c2"></th><th data-i="ho.c3"></th><th data-i="ho.c4"></th><th data-i="ho.c5"></th></tr></thead><tbody id="ho"></tbody></table>
 <div class="empty hide" id="hoEmpty"><b data-i="ho.e1"></b><span data-i="ho.e2"></span></div></div></section>

<section id="knowledge" class="hide"><div class="glass card">
 <div class="hd"><h2 data-i="kn.h"></h2><span class="mut small" data-i="kn.s"></span><div class="sp"></div><button class="btn" id="kadd"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i="kn.add"></span></button></div>
 <table class="idx"><thead><tr><th data-i="kn.q"></th><th data-i="kn.a"></th><th data-i="kn.t"></th><th></th></tr></thead><tbody id="kl"></tbody></table>
 <div class="empty hide" id="klEmpty"><b data-i="kn.e1"></b><span data-i="kn.e2"></span></div></div></section>

<section id="settings" class="hide"><div class="g2">
 <div>
  <div class="glass card"><h3 data-i="se.chat"></h3>
   <div class="line"><div class="tx"><b data-i="se.en"></b><span data-i="se.ens"></span></div><label class="tog"><input type="checkbox" id="sen"><i></i></label></div>
   <div class="line"><div class="tx"><b data-i="se.llm"></b><span id="llmNote"></span></div><label class="tog"><input type="checkbox" id="sllm"><i></i></label></div>
   <label class="f" style="margin-top:12px"><span data-i="se.gr"></span><input id="sg_en" placeholder="English"><input id="sg_de" placeholder="Deutsch" style="margin-top:6px"><input id="sg_fr" placeholder="Français" style="margin-top:6px"><input id="sg_it" placeholder="Italiano" style="margin-top:6px"></label>
   <div class="row"><label class="f"><span data-i="se.lang"></span><select id="slang"><option value="auto"></option><option value="en">English</option><option value="zh">中文</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option></select></label>
   <label class="f"><span data-i="se.hours"></span><input id="sh" type="number" min="1" max="168"></label></div></div>
  <div class="glass card"><h3 data-i="se.look"></h3>
   <label class="f"><span data-i="se.color"></span><div class="sw" id="swatch"><input type="color" id="scol"></div></label>
   <label class="f"><span data-i="se.pos"></span><div class="seg" id="spos"><button data-p="left" data-i="se.left"></button><button data-p="right" data-i="se.right"></button></div></label>
   <div class="row"><label class="f"><span data-i="se.title"></span><input id="stitle" maxlength="60"></label><label class="f"><span data-i="se.av"></span><input id="sav" placeholder="https://…"></label></div>
   <p class="small mut" style="margin:0" data-i="se.embed"></p></div>
  <button class="btn" id="ssave"><span data-i="save"></span></button>
 </div>
 <div class="glass card"><h3 data-i="se.prev"></h3><div class="phone" id="sprev" style="height:430px"><div class="ph-h"><div class="av" id="pav">P</div><div><b id="ptitle"></b><small><span class="dot"></span><span data-i="online"></span></small></div></div><div class="ph-log"><div class="m a" id="pgreet"></div><div class="chips"><button data-i="c1"></button><button data-i="c2"></button></div></div></div>
  <h3 style="margin-top:18px" data-i="se.trk"></h3><div id="tsrc"></div></div>
</div></section>

<section id="preview" class="hide"><div class="g2">
 <div class="phone" id="phone"><div class="ph-h"><div class="av">P</div><div><b id="ptitle2">Chat</b><small><span class="dot"></span><span data-i="online"></span></small></div></div><div class="ph-log" id="chat"></div>
  <form class="ph-in" id="pform"><input id="pin" autocomplete="off"><button class="btn" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form></div>
 <div class="glass card"><h2 data-i="pv.h"></h2><p class="mut" data-i="pv.s"></p><div class="chips" id="pvchips"></div></div>
</div></section>
</div>

<dialog id="kdlg"><form method="dialog"><div class="in"><h2 id="kdh"></h2><p class="mut small" data-i="kn.s"></p>
 <label class="f"><span data-i="kn.q"></span><input id="kq" required maxlength="300"></label>
 <label class="f"><span data-i="kn.a"></span><textarea id="ka" rows="5" required maxlength="2000"></textarea></label>
 <label class="f"><span data-i="kn.t"></span><input id="kt" placeholder="shipping, gift"></label></div>

 const s=d.sla,cell=(l,v,c="")=>`<div style="padding:12px 0;border-top:1px solid var(--line);display:flex"><span class="mut">${l}</span><b style="margin-left:auto" class="${c}">${v}</b></div>`;
 $("#sla").innerHTML=`<div style="display:flex;align-items:baseline;gap:8px"><span style="font:500 40px Georgia,serif">${s.open}</span><span class="badge ${s.open?"b-warn":"b-ok"}">${t("sla.open")}</span><div class="sp"></div><button class="btn s xs" data-go="handoffs">${t("sla.go")}</button></div>`+
  cell(t("sla.wait"),s.oldest_wait_h==null?"–":t("ago",{h:s.oldest_wait_h}))+cell(t("sla.res"),s.avg_resolve_h==null?"–":t("ago",{h:s.avg_resolve_h}))+cell(t("sla.target"),t("ago",{h:s.target_h}));
 const lt=Object.values(d.languages).reduce((a,b)=>a+b,0)||1,ap=d.answer_paths,at=(ap.local+ap.llm)||1;
 $("#tech").innerHTML=Object.entries(d.languages).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k.toUpperCase())}</span><div class="t"><i style="width:${v/lt*100}%"></i></div><b>${Math.round(v/lt*100)}%</b></div>`).join("")+
  `<div class="prog" style="height:10px;margin-top:16px;display:flex"><i style="width:${ap.local/at*100}%"></i><i style="width:${ap.llm/at*100}%;background:#d9c3ad"></i></div><div class="small mut" style="display:flex"><span>${t("local")} ${Math.round(ap.local/at*100)}%</span><span style="margin-left:auto">${t("llm")} ${Math.round(ap.llm/at*100)}%</span></div>`;
 $("#ovsub").textContent="";i18n();checklist().catch(()=>{});}

let conv=null;const log=()=>$("#chat");
function bub(c,txt){const d=document.createElement("div");d.className="m "+c;d.textContent=txt;log().append(d);log().scrollTop=1e9;return d;}
function cards(ui){(ui||[]).forEach(u=>{const w=document.createElement("div");
 if(u.type==="chips"){w.className="chips";w.innerHTML=u.items.map(x=>`<button type="button">${esc(x)}</button>`).join("");w.onclick=e=>e.target.tagName==="BUTTON"&&ask(e.target.textContent);}
 else if(u.type==="products"){w.className="car";w.innerHTML=u.items.map(p=>`<div class="pc">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:`<span class="ph"></span>`}<div><b>${esc(p.name)}</b><span class="mut">${isFinite(p.unit_price)?Number(p.unit_price).toFixed(2)+" "+esc(p.currency||""):""}</span></div></div>`).join("");}
 else if(u.type==="handoff"){w.className="oc";w.textContent=u.email?`✉ ${u.email}`:"✉ —";}
 else if(u.type==="order"){const o=u.order;w.className="oc";w.innerHTML=`<div style="display:flex"><b>${esc(o.name)}</b><span class="badge b-${o.fulfillment==="FULFILLED"?"ok":"warn"}" style="margin-left:auto">${esc(String(o.fulfillment||"").toLowerCase().replace(/_/g," "))}</span></div><div class="mut">${o.items.map(i=>`${i.quantity}× ${esc(i.title)}`).join(", ")}</div>`;}
 else if(u.type==="tracking"){w.className="oc";w.innerHTML=`<div style="display:flex;gap:8px"><b>${esc(u.carrier||"")}</b><span class="mut">${esc(u.number)}</span><span class="badge b-info" style="margin-left:auto">${esc(u.status||"")}</span></div><ul class="tl">${(u.events||[]).slice(0,4).map(e=>`<li><b>${esc(e.text||"")}</b><div class="mut small">${esc([e.time,e.location].filter(Boolean).join(" · "))}</div></li>`).join("")}</ul>${u.url?`<a href="${esc(u.url)}" target="_blank" rel="noopener" class="small">${t("track")} →</a>`:""}`;}
 else return;log().append(w);});log().scrollTop=1e9;}
