<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="robots" content="noindex"/>
<title>Order confirmation · Wed.AI</title>
<style>
:root{--paper:#fffdf9;--ink:#28231f;--muted:#7c746c;--line:rgba(45,36,30,.12);--accent:#9a6d57;--soft:#f6f1eb;--ok:#2f6b3f}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f3ece5,#fbf8f4 40%);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(255,253,249,.9)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.logo{width:34px;height:34px;border-radius:11px;background:#292622;color:#fff;display:grid;place-items:center;font-weight:700}.brand b{font-size:13px;letter-spacing:.04em}
.lang-switch{display:inline-flex;align-items:center;gap:2px;padding:3px;background:#f2f1ee;border:1px solid #e7e4de;border-radius:8px}.lang-switch button{height:28px;min-width:34px;padding:0 9px;border:0;background:transparent;border-radius:6px;color:#77736d;font-size:11px;font-weight:600;cursor:pointer}.lang-switch button.active{background:#fff;color:#171717;box-shadow:0 1px 3px rgba(30,26,20,.08)}
.wrap{max-width:1040px;margin:0 auto;padding:30px 24px 60px}
.hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}.mark{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:24px}.mark.pending{background:#b38a3c}.mark.cancelled{background:#a8402f}
.hero h1{font:30px Georgia,serif;font-weight:500;margin:2px 0 4px}.hero p{margin:0;color:var(--muted)}.ono{display:inline-block;margin-top:8px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}.card h2{font:19px Georgia,serif;font-weight:500;margin:0 0 12px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}.tl li{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:16px}.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:14px;top:28px;bottom:0;width:2px;background:#e2d9cf}.tl li:last-child:before{display:none}
.tl i{width:28px;height:28px;border-radius:50%;border:2px solid #cfc5bb;background:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}.tl li.done i{background:var(--ok);border-color:var(--ok);color:#fff}.tl li.now i{border-color:var(--ink);color:var(--ink)}
.tl b{display:block;font-size:14px}.tl span{font-size:12.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
.th{position:relative;width:64px;height:64px;border-radius:12px;background:#f2ece5;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}.th em{position:absolute;top:-1px;right:-1px;min-width:20px;height:20px;border-radius:999px;background:#6f6258;color:#fff;font:700 11px/20px Inter,system-ui;text-align:center;font-style:normal;padding:0 5px}
.line b{display:block;font-size:13.5px}.line span{display:block;font-size:12px;color:var(--muted)}.line .d{color:var(--ok);font-weight:600}.line strong{white-space:nowrap}
.rows{display:grid;gap:6px;font-size:13.5px}.rows div{display:flex;justify-content:space-between}.rows span:last-child{color:var(--muted)}.rows .total{font-size:15px;font-weight:600;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.rows .total strong{font:22px Georgia,serif}
.addr{font-size:13.5px;line-height:1.6}
.actions{display:grid;gap:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;text-decoration:none;font-weight:600;border:1px solid var(--line);background:#fff}.btn.primary{background:#292622;color:#fff;border-color:#292622}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:20px 16px 40px}.hero h1{font-size:25px}.top{padding:10px 14px}}
.eta{display:block;color:#2f6b3f;font-weight:600}.eta-big{font:22px Georgia,serif;color:#2f6b3f}.small-muted{font-size:12.5px;color:var(--muted);margin-top:4px}.tl li.now i{animation:pspulse 1.4s ease-in-out infinite}@keyframes pspulse{50%{box-shadow:0 0 0 5px rgba(40,35,31,.12)}}</style>
<link rel="stylesheet" href="mobile.css"><script async src="https://www.googletagmanager.com/gtag/js?id=G-GED5TST3DP"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-GED5TST3DP");</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div id="site-header"></div><script src="/header.js?v=20261025b"></script>
<main class="wrap">
  <section class="hero"><div class="mark" id="mark">…</div><div><h1 id="title">Processing your order</h1><p id="lead"></p><span class="ono" id="ono" hidden></span></div></section>
  <div class="grid">
    <div>
      <section class="card" id="nextCard"><h2 data-i18n="ps.next">What happens next</h2><ol class="tl" id="timeline"></ol></section>
      <section class="card" id="itemsCard" hidden><h2 data-i18n="co.items">Items</h2><div id="lines"></div></section>
      <div class="note" id="noToken" hidden></div>
      <div class="note" id="slowNote" role="status" hidden></div>
    </div>
    <aside>
      <section class="card" id="etaCard" hidden><h2 data-i18n="ps.eta">Estimated delivery</h2><div class="eta-big" id="etaText"></div><div class="small-muted" id="etaSub"></div></section>
      <section class="card" id="totalsCard" hidden><h2 data-i18n="co.summary">Order summary</h2><div class="rows" id="totals"></div></section>
      <section class="card" id="addrCard" hidden><h2 data-i18n="ps.shipTo">Shipping address</h2><div class="addr" id="addr"></div></section>
      <div class="actions"><a class="btn primary" id="accountLink" href="/account.html#orders" data-i18n="ps.viewOrder">View order in my account</a><a class="btn" href="/" data-i18n="ps.continue">Continue shopping</a><a class="btn" id="retry" href="/checkout.html?payment=cancelled" hidden data-i18n="ps.retry">Back to checkout</a><a class="btn" href="mailto:Sherryxuex@Gmail.com" data-i18n="ps.contact">Contact us</a></div>
    </aside>
  </div>
</main>
<script src="i18n.js"></script>
<script>
(function(){
const q=new URLSearchParams(location.search),id=q.get("order"),tok=q.get("t"),initial=q.get("status")||"";
const I=()=>window.WeddingI18n||{k:x=>x,lang:()=>"en"},K=(k,v)=>I().k(k,v),$=x=>document.getElementById(x);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(n,c)=>new Intl.NumberFormat(I().lang()==="de"?(c==="EUR"?"de-DE":"de-CH"):(I().lang()==="zh"?"zh-CN":"en-GB"),{style:"currency",currency:c||"CHF"}).format(Number(n)||0);
// Paid = the server says so (confirmation payment_status, or financial_status from /status) — never the ?status= URL hint alone.
let data=null,status=initial,paid=false,polls=0,slow=false;
const POST_PAY=["Approved","Production","Shipped","Delivered"],isPaid=(ps,st)=>ps==="paid"||POST_PAY.includes(st);
function paint(){
  const good=paid,cancelled=!good&&(/^cancel/i.test(status||"")||/^cancel/i.test(data?.status||""));
  if(good){try{localStorage.removeItem("pod-cart-v1")}catch(e){}}
  const kind=good?"paid":cancelled?"cancelled":"pending";
  $("mark").className="mark"+(kind==="paid"?"":" "+kind);$("mark").textContent=good?"✓":cancelled?"×":"…";
  $("title").textContent=K("ps.title."+kind);
  $("lead").textContent=kind==="paid"?K("ps.lead.paid",{e:data?.email||"…"}):K("ps.lead."+kind);
  $("retry").hidden=!cancelled;
  if(id){$("ono").hidden=false;$("ono").textContent=`${K("ps.order")}: ${id}`}
  const tl=(data?.timeline||[{id:"paid"},{id:"proof"},{id:"production"},{id:"shipping"}]).map(x=>x.id==="paid"?{...x,done:good}:(!good?{...x,done:false}:x));
  const nowIdx=tl.findIndex(s=>!s.done);
  $("timeline").innerHTML=tl.map((s,i)=>`<li class="${s.done?"done":i===nowIdx?"now":""}"><i>${s.done?"✓":i+1}</i><div><b>${esc(K(s.id==="paid"&&!good?"ps.step.paying":"ps.step."+s.id))}</b><span>${esc(s.id==="paid"&&!good&&!cancelled?K("ps.poll.check"):s.id==="paid"&&cancelled?K("ps.lead.cancelled"):s.id==="proof"&&s.choice==="approve"?K("pay.tl.proofSkip"):s.id==="proof"&&s.preparing?K("pay.tl.proofPrep"):s.id==="proof"&&s.waiting?K("pay.tl.proofWait"):K("ps.step."+s.id+".d"))}</span>${s.id==="proof"&&data?.proof?.ready&&data.proof.review_url?`<a class="eta" href="${esc(data.proof.review_url)}">${esc(K("acct.od.proofOpen"))} →</a>`:""}${s.id==="shipping"&&data?.delivery_estimate&&window.PODDates?`<span class="eta">${esc(K("pay.delivery"))}: ${esc(window.PODDates.range(data.delivery_estimate.from,data.delivery_estimate.to))}</span>`:""}</div></li>`).join("");
  $("noToken").hidden=!!data||!id;$("noToken").textContent=K("ps.noToken");
  $("slowNote").hidden=!(slow&&!good&&!cancelled);$("slowNote").textContent=K("ps.poll.slow");
  const est=data?.delivery_estimate;$("etaCard").hidden=!(est&&window.PODDates&&!cancelled);if(est&&window.PODDates){$("etaText").textContent=window.PODDates.range(est.from,est.to);$("etaSub").textContent=data.proof_choice==="proof"?K("pay.tl.proofWait"):""}
  if(!data)return;
  const c=data.currency;
  $("itemsCard").hidden=false;
  $("lines").innerHTML=data.items.map(l=>{const sz=Object.entries(l.sizes||{}).map(([k,v])=>`${k}×${v}`).join(", "),img=l.thumb_url||l.image;
    return `<div class="line"><div class="th">${img?`<img src="${esc(img)}" alt="" width="64" height="64" onerror="this.onerror=null;this.src='${esc(l.image||"")}'">`:""}<em>${l.quantity}</em></div><div><b>${esc(l.name)}</b><span>${esc([l.material,sz].filter(Boolean).join(" · "))}</span>${l.has_design?`<span class="d">✓ ${esc(K("co.designAttached"))}</span>`:""}</div><strong>${money(l.line_total,c)}</strong></div>`}).join("");
  const t=data.totals,rate=t.tax_rate?Math.round(t.tax_rate*1000)/10:0;
  $("totalsCard").hidden=false;
  $("totals").innerHTML=`<div><span>${esc(K("cart.subtotal"))}</span><strong>${money(t.subtotal,c)}</strong></div>${t.packaging>0?`<div><span>${esc(K("co.packaging"))}</span><span>${money(t.packaging,c)}</span></div>`:""}${t.discount>0?`<div><span>${esc(K("co.discount",{c:t.promo_code}))}</span><span>− ${money(t.discount,c)}</span></div>`:""}<div><span>${esc(K("cart.shipping"))}</span><span>${Number(t.shipping)===0?esc(K("co.free")):money(t.shipping,c)}</span></div><div><span>${esc(rate?K(t.prices_include_vat?"co.taxIncl":"co.tax",{rate}):K("co.taxNone"))}</span><span>${money(t.tax,c)}</span></div><div class="total"><span>${esc(K("cart.total"))}</span><strong>${money(t.grand_total,c)}</strong></div>`;
  const a=data.shipping_address||{};
  $("addrCard").hidden=!(a.name||a.address1);$("addr").innerHTML=[a.name,a.address1,a.address2,[a.postal_code,a.city].filter(Boolean).join(" "),a.country].filter(Boolean).map(esc).join("<br>");
  $("accountLink").href=data.account_url||"/account.html#orders";
}
async function load(){
  if(id&&tok){try{const r=await fetch(`/api/orders/${encodeURIComponent(id)}/confirmation?t=${encodeURIComponent(tok)}`);if(r.ok){data=await r.json();status=data.status;paid=isPaid(data.payment_status,data.status)}}catch(e){}}
  if(!data&&id){try{const r=await fetch("/api/orders/"+encodeURIComponent(id)+"/status");const d=await r.json();if(r.ok){status=d.status;paid=isPaid(d.financial_status,d.status)}}catch(e){}}
  paint();
  // Poll while the provider confirms (≈2 min, slowing down); afterwards show the "taking longer" fallback and keep checking every 30 s.
  const cancelled=/^cancel/i.test(status||"");
  if(id&&!paid&&!cancelled){polls++;if(polls>=25&&!slow){slow=true;paint()}setTimeout(load,polls<10?3000:polls<25?6000:30000)}
}
window.addEventListener("wedding-language-change",paint);
paint();load();
})();
</script>
<div id="site-footer"></div><script src="/footer.js" defer></script>
</body></html>
