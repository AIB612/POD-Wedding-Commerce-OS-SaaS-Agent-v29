<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Payment Status</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#e9dfd5,#f8f4ef);font-family:Inter,system-ui;color:#292521}.card{width:min(560px,92vw);background:#fffdf9;border:1px solid rgba(50,40,34,.12);border-radius:26px;padding:34px;box-shadow:0 28px 80px rgba(45,34,28,.16)}.mark{width:56px;height:56px;border-radius:50%;background:#292622;color:#fff;display:grid;place-items:center;font-size:24px}.card h1{font:34px Georgia,serif;font-weight:500;margin:20px 0 8px}.card p{color:#746a63;font-size:13px;line-height:1.7}.status{margin:18px 0;padding:12px;border-radius:14px;background:#f5eee8;font-size:11px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:10px 13px;border-radius:999px;border:1px solid rgba(50,40,34,.12);text-decoration:none;color:#292521;font-size:11px}.actions a.primary{background:#292622;color:#fff}.flow{margin-top:20px;border-top:1px solid rgba(50,40,34,.12);padding-top:16px;font-size:10px;color:#746a63;line-height:1.65}
.lang-switch{display:inline-flex;align-items:center;gap:2px;padding:3px;background:#f2f1ee;border:1px solid #e7e4de;border-radius:8px}
.lang-switch button{height:28px;min-width:34px;padding:0 9px;border:0;background:transparent;border-radius:6px;color:#77736d;font-size:11px;font-weight:600;cursor:pointer}
.lang-switch button.active{background:#fff;color:#171717;box-shadow:0 1px 3px rgba(30,26,20,.08)}
.page-lang{position:fixed;top:18px;right:18px;z-index:10}</style></head>
<body><div class="page-lang"><div class="lang-switch" data-lang-switch><button data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div></div><div class="card"><div class="mark" id="mark">✓</div><h1 id="title">Payment received</h1><p id="desc">我们正在同步支付状态。</p><div class="status" id="statusBox"></div><div class="actions"><a class="primary" href="/">返回婚礼选品</a><a href="#" id="refresh">刷新订单状态</a></div><div class="flow"><b>后续流程</b><br/>支付确认后进入 Proofing。最终效果图和材质会在支付后 2 小时内确认并发送到您的邮箱；确认后进入生产与配送，预计 14 天内送达。</div></div>
<script src="i18n.js"></script>
<script>
const q=new URLSearchParams(location.search),id=q.get("order"),initial=q.get("status")||"";
async function load(){
  if(!id){render(initial||"UNKNOWN");return}
  try{const r=await fetch("/api/orders/"+encodeURIComponent(id)+"/status");const d=await r.json();if(!r.ok)throw new Error();render(d.status,d)}catch{render(initial||"UNKNOWN")}
}
function render(s,d={}){
 const I=window.WeddingI18n||{t:x=>x,lang:()=>"zh"},good=["Paid","Proofing","AwaitingApproval","Approved","Production","Shipped","Delivered","COMPLETED"].includes(s),cancelled=["CANCELLED","Cancelled"].includes(s);
 if(good){try{localStorage.removeItem("pod-cart-v1")}catch(e){}}
 document.getElementById("mark").textContent=good?"✓":cancelled?"×":"…";
 document.getElementById("title").textContent=I.t(good?"支付已确认":cancelled?"支付已取消":"订单处理中");
 document.getElementById("desc").textContent=I.t(good?"订单已进入定制与效果确认流程。":cancelled?"本次支付没有完成，购物车内容仍可重新提交。":"支付平台和订单系统可能需要几秒钟完成同步。");
 const l=I.lang(),L=l==="de"?["Bestellung","Aktueller Status","Zahlungsstatus"]:l==="en"?["Order","Current status","Payment status"]:["订单","当前状态","支付状态"];
 document.getElementById("statusBox").innerHTML=`${L[0]}：${id||"—"}<br>${L[1]}：${s||"—"}${d.financial_status?`<br>${L[2]}：${d.financial_status}`:""}`;
}
document.getElementById("refresh").onclick=e=>{e.preventDefault();load()};load();
</script></body></html>
