<!doctype html><html><body style="margin:0;background:#f6f5f2;font-family:Arial,Helvetica,sans-serif;color:#1f1d1a">
<div style="max-width:620px;margin:0 auto;padding:28px 18px"><div style="background:#fff;border:1px solid #e7e4de;border-radius:12px;padding:28px">
  <p style="margin:0;color:#77736d;font-size:12px;letter-spacing:.08em;text-transform:uppercase">Shipped</p>
  <h1 style="margin:6px 0 10px;font-size:24px">Your order {{order_id}} is on its way</h1>
  {{#carrier}}<p style="margin:0 0 6px">Carrier: <b>{{carrier}}</b></p>{{/carrier}}
  {{#tracking_number}}<p style="margin:0 0 16px">Tracking number: <b>{{tracking_number}}</b></p>{{/tracking_number}}
  {{#tracking_url}}<p><a href="{{tracking_url}}" style="background:#1f1d1a;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;display:inline-block">Track parcel</a></p>{{/tracking_url}}
  <p style="font-size:13px"><a href="{{order_url}}" style="color:#1f1d1a">Order details</a> · <a href="{{account_url}}" style="color:#1f1d1a">My account</a></p>
</div></div></body></html>
