<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My POD Studio</title>
<style>
:root{--bg:#f5f1ec;--card:#fffdf9;--ink:#28231f;--muted:#7c746c;--line:rgba(45,36,30,.12);--soft:#f1ece6;--ok:#e9f4ec;--warn:#fff3dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:34px auto;padding:0 20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted)}h1{font:36px Georgia,serif;margin:4px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.stack{display:grid;gap:16px}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px;line-height:1.55}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#fff;cursor:pointer;text-decoration:none;color:inherit}.btn.dark{background:#292622;color:#fff}.tag{display:inline-flex;font-size:11px;border-radius:999px;padding:4px 8px;background:var(--soft)}.tag.ok{background:var(--ok)}.order{padding:16px;border:1px solid var(--line);border-radius:16px;margin-top:12px}.order-head{display:flex;justify-content:space-between;gap:14px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}.step{border-top:3px solid #ddd2c8;padding-top:7px;font-size:10px;color:var(--muted)}.step.done{border-color:#4f775b;color:var(--ink)}.event{display:grid;grid-template-columns:9px 1fr auto;gap:9px;align-items:start;padding:8px 0}.event i{width:8px;height:8px;border-radius:50%;background:#bfb3a8;margin-top:5px}.event b{font-size:12px}.event time{font-size:10px;color:var(--muted)}.notice{padding:10px 12px;border-radius:12px;background:var(--warn);font-size:12px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:30px}}
</style></head>
<body><div class="wrap"><div class="top"><div><div class="eyebrow">POD STUDIO ACCOUNT</div><h1>我的方案与订单</h1><div class="muted" id="who"></div></div><div class="actions"><a class="btn dark" href="studio.html">继续设计</a><button class="btn" id="refresh">刷新</button><button class="btn" id="logout">退出</button></div></div><div id="content" class="card">加载中…</div></div>
<script src="account-auth.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=['requested','proof','approved','production','shipped'];
function stageOf(o,p){const s=String(o.status||'').toLowerCase();if(/delivered|shipped/.test(s))return 5;if(/production/.test(s))return 4;if(/approved/.test(s))return 3;if(p?.proof_url||/proof/.test(s))return 2;return 1}
function orderCard(o,d){const p=(d.proofs||[]).find(x=>x.order_id===o.id),ev=(d.order_events||[]).filter(x=>x.order_id===o.id),n=stageOf(o,p);const labels=['已提交','效果确认','已批准','生产','发货'];const mail=[...(d.notifications||[])].reverse().find(x=>x.related_id===o.id&&x.channel==='email');return `<article class="order"><div class="order-head"><div><b>${esc(o.id)}</b><div class="muted">${esc(o.created_at||'')} · ${esc(o.buyer_type||'')}</div></div><div style="text-align:right"><span class="tag ${/approved|production|shipped|delivered/i.test(o.status||'')?'ok':''}">${esc(o.status||'')}</span><div style="margin-top:5px"><b>${esc(o.currency||'')} ${Number(o.revenue||0).toFixed(2)}</b></div></div></div><div class="steps">${labels.map((x,i)=>`<div class="step ${n>=i+1?'done':''}">${n>i?'✓ ':''}${x}</div>`).join('')}</div>${p?.status==='Approved'?`<div class="notice">✓ 效果图已经确认，订单正在进入后续生产流程。</div>`:p?.status==='ChangesRequested'?`<div class="notice">修改要求已提交，正在等待新版效果图。新版准备好后会自动发送邮件。</div>`:p?.proof_url?`<div class="notice">效果图已经准备好，可以确认后进入下一步。</div><div class="actions"><a class="btn dark" href="${esc(p.approval_url)}">查看并确认效果图 →</a></div>`:p?`<div class="notice">效果图正在准备中。上传后系统会自动发邮件，并在这里出现确认入口。</div>`:''}<div class="muted" style="margin-top:12px">最近邮件：${mail?`${esc(mail.subject)} · ${esc(mail.status)}`:'尚无记录'}</div>${ev.length?`<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">查看订单时间线</summary><div>${ev.slice(0,12).map(e=>`<div class="event"><i></i><div><b>${esc(e.event_type||'Update')}</b><div class="muted">${esc(e.payload?.status||e.payload?.note||'')}</div></div><time>${esc(String(e.event_time||e.created_at||'').replace('T',' ').slice(0,16))}</time></div>`).join('')}</div></details>`:''}</article>`}
async function load(){try{const u=await PODAuth.require();document.getElementById('who').textContent=`${u.name||''}${u.name?' · ':''}${u.email}`;const r=await fetch('/api/account/dashboard');if(!r.ok)throw new Error('dashboard_failed');const d=await r.json();document.getElementById('content').outerHTML=`<div id="content" class="grid"><section class="card"><div class="eyebrow">ORDERS</div><h2>订单与生产进度</h2>${(d.orders||[]).map(o=>orderCard(o,d)).join('')||'<div class="muted">暂无订单。完成设计后提交 Request order，这里会同步订单、Proof、生产和发货状态。</div>'}</section><aside class="stack"><section class="card"><div class="eyebrow">PROJECTS</div><h2>设计方案</h2>${(d.projects||[]).map(p=>`<div class="row"><div><b>${esc(p.scenario_id||'Custom')}</b><div class="muted">${esc(p.id)} · ${esc(p.status||'draft')}</div></div><a class="btn" href="studio.html?project=${encodeURIComponent(p.id)}">打开</a></div>`).join('')||'<div class="muted">暂无方案</div>'}</section><section class="card"><div class="eyebrow">NOTIFICATIONS</div><h2>邮件与通知</h2>${(d.notifications||[]).slice(0,12).map(n=>`<div class="row"><div><b style="font-size:12px">${esc(n.subject||n.type)}</b><div class="muted">${esc(n.to||'')}</div></div><span class="tag ${n.status==='sent'?'ok':''}">${esc(n.status||'pending')}</span></div>`).join('')||'<div class="muted">暂无通知</div>'}</section></aside><section class="card" id="rsvpBox" style="grid-column:1/-1"><div class="eyebrow">WEDDING WEBSITE · RSVP</div><h2>婚礼网站回复</h2><div class="muted">加载中…</div></section></div>`;loadRsvps(d.invitations||[]);}catch(e){if(e.message!=='auth_cancelled')document.getElementById('content').innerHTML='<div class="notice">需要登录后才能查看账号数据。</div>';}}
// Built-in RSVP responses for the couple's own published wedding sites (server checks ownership).
async function loadRsvps(invs){const box=document.getElementById('rsvpBox');if(!box)return;const head='<div class="eyebrow">WEDDING WEBSITE · RSVP</div><h2>婚礼网站回复</h2>';if(!invs.length){box.innerHTML=head+'<div class="muted">暂无已发布的婚礼网站。登录后在首页“生成专属婚礼网站”并保存为专属链接，宾客回复会显示在这里。</div>';return}
const parts=await Promise.all(invs.slice(0,20).map(async inv=>{try{const r=await fetch(`/api/account/invitations/${encodeURIComponent(inv.id)}/rsvps`);if(!r.ok)throw 0;const x=await r.json(),c=x.counts;return `<article class="order"><div class="order-head"><div><b>${esc(inv.names||inv.id)}</b><div class="muted">${esc(inv.date||'')} · <a href="${esc(inv.url)}" target="_blank" rel="noopener">${esc(inv.url)}</a></div></div><div class="actions" style="margin-top:0">${inv.status==='unpublished'?'<span class="tag">已下线</span>':''}<span class="tag ok">出席 ${c.attending} · 共 ${c.guests} 位</span><span class="tag">不出席 ${c.declined}</span><span class="tag">回复 ${c.responses}</span><a class="btn" href="/?edit=${encodeURIComponent(inv.id)}">编辑</a><button class="btn" type="button" data-copy-link="${esc(location.origin+inv.url)}">复制邀请链接</button><button class="btn" type="button" data-pub="${esc(inv.id)}" data-act="${inv.status==='unpublished'?'republish':'unpublish'}">${inv.status==='unpublished'?'重新上线':'下线'}</button><a class="btn" href="/api/account/invitations/${encodeURIComponent(inv.id)}/rsvps.csv">导出 CSV</a></div></div>${x.rsvps.length?`<div class="actions rsvp-filter" role="group" aria-label="筛选回复" style="margin-top:12px"><button class="btn dark" type="button" data-f="all" aria-pressed="true">全部 ${c.responses}</button><button class="btn" type="button" data-f="yes" aria-pressed="false">出席 ${c.attending}</button><button class="btn" type="button" data-f="no" aria-pressed="false">缺席 ${c.declined}</button></div><div style="margin-top:12px">${x.rsvps.map(r=>`<div class="row" data-att="${r.attending?'yes':'no'}"><div><b>${esc(r.name)}</b><div class="muted">${r.dietary?esc(r.dietary):'—'}${r.contact?` · ${esc(r.contact)}`:''}</div></div><div style="text-align:right"><span class="tag ${r.attending?'ok':''}">${r.attending?`出席 · ${r.party_size} 位`:'不出席'}</span><div class="muted" style="margin-top:4px">${r.updated_at&&r.updated_at!==r.created_at?'已更新 · ':''}${esc((d=>isNaN(d)?'':d.toLocaleString('zh-CN',{hour12:false}).slice(0,-3))(new Date(r.updated_at||r.created_at)))}</div></div></div>`).join('')}</div>`:'<div class="muted" style="margin-top:10px">暂无回复</div>'}</article>`}catch{return `<article class="order"><b>${esc(inv.names||inv.id)}</b><div class="muted">无法加载回复</div></article>`}}));
box.innerHTML=head+parts.join('');
// Filter 全部/出席/缺席 per invitation, and copy the guest link.
box.onclick=async ev=>{const f=ev.target.closest('[data-f]'),cp=ev.target.closest('[data-copy-link]');
 if(f){const art=f.closest('article');art.querySelectorAll('[data-f]').forEach(b=>{const on=b===f;b.classList.toggle('dark',on);b.setAttribute('aria-pressed',on)});art.querySelectorAll('.row[data-att]').forEach(r=>r.style.display=f.dataset.f!=='all'&&r.dataset.att!==f.dataset.f?'none':'')}
 const pb=ev.target.closest('[data-pub]');if(pb){const off=pb.dataset.act==='unpublish';if(off&&!confirm('下线后宾客打开链接会看到“此邀请已下线”，也无法再回复。已收到的回复会保留，之后可以重新上线。确定下线吗？'))return;pb.disabled=true;const r=await fetch(`/api/invitations/${encodeURIComponent(pb.dataset.pub)}/${pb.dataset.act}`,{method:'POST'});if(r.ok)load();else{pb.disabled=false;alert('操作失败，请稍后再试')}return}
 if(cp){const u=cp.dataset.copyLink;try{await navigator.clipboard.writeText(u);cp.textContent='已复制 ✓'}catch{prompt('复制邀请链接',u)}setTimeout(()=>cp.textContent='复制邀请链接',1800)}}}
load();document.getElementById('refresh').onclick=()=>location.reload();document.getElementById('logout').onclick=()=>PODAuth.logout();
</script></body></html>
