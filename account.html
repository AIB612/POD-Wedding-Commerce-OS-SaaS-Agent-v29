<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account · POD Wedding Studio</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="cart.css">
<style>
:root{--bg:#f5f1ec;--card:#fffdf9;--ink:#28231f;--muted:#7c746c;--line:rgba(45,36,30,.12);--soft:#f3ece4;--accent:#9a6d57;--dark:#292622}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eee7df,#f8f4ef);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:var(--accent)}button{font:inherit}
.top{display:flex;align-items:center;gap:10px;height:68px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(255,253,249,.86);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.top .brand{color:var(--ink);text-decoration:none;font-weight:800;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:13px;background:var(--dark);color:#fff;display:grid;place-items:center}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;margin:22px 22px 0;align-items:start}
.side{position:sticky;top:90px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:72px;height:72px;font-size:26px}
.who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who>div{min-width:0}
.nav{display:grid;gap:2px}.nav a,.nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:13.5px;border:0;background:none;cursor:pointer;text-align:left;white-space:nowrap}
.nav a:hover,.nav button:hover{background:var(--soft)}.nav a[aria-current=page]{background:var(--dark);color:#fff}.nav svg{width:18px;height:18px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:6px 4px}
.main{min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 18px;flex-wrap:wrap}.ph h1{margin:0;font:600 28px/1.2 Georgia,serif}.ph p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:12.5px;margin-bottom:6px}.crumb a{text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.card h2{margin:0 0 12px;font-size:16px}.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.card-h h2{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit}.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}.grid2>.card{margin-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid rgba(45,36,30,.2);border-radius:999px;padding:0 16px;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}.btn:hover{border-color:var(--ink)}.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}.btn.sm{min-height:32px;padding:0 12px;font-size:12px}.btn.link{border:0;background:none;padding:0 6px;color:var(--accent)}.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:#eee8e1;color:#5d554e}.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.awaiting_payment{background:#fff1d6;color:#8a5a00}.pill.paid{background:#e4eefb;color:#1f5aa6}.pill.proof{background:#f1e8fb;color:#6b3fa0}.pill.in_production{background:#fdeee3;color:#a4501b}.pill.shipped{background:#e1f3f1;color:#17736a}.pill.delivered{background:#e4f3e6;color:#2d6b39}.pill.cancelled{background:#f3e3e1;color:#9a3a2c}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.form input,.form select{min-height:40px;border:1px solid rgba(45,36,30,.2);border-radius:10px;padding:0 12px;background:#fff;font:inherit;color:var(--ink)}.toolbar input{flex:1;min-width:200px}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#faf6f1}.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#faf6f1}.tbl .r{text-align:right}
.tblwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.thumbs{display:flex;align-items:center}.thumbs img,.thumbs .ph0{width:40px;height:40px;border-radius:8px;object-fit:cover;border:2px solid #fff;background:var(--soft);margin-left:-8px;display:grid;place-items:center;font-size:11px;color:var(--muted)}.thumbs>:first-child{margin-left:0}
.oid{font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}.tbl td:nth-child(2){white-space:nowrap}
.empty{text-align:center;padding:42px 20px}.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px}.empty .ic svg{width:26px;height:26px}.empty h3{margin:0 0 4px;font-size:16px}.empty p{margin:0 auto 16px;color:var(--muted);max-width:44ch}
.lines .ln{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.lines .ln:last-child{border-bottom:0}.lines img,.lines .ph0{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--soft)}
.sum{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.sum div{display:flex;justify-content:space-between}.sum .tot{font-weight:700;font-size:15px;padding-top:6px;border-top:1px solid var(--line)}
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:0 0 18px 28px}.tl li::before{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#d8cec4;box-shadow:0 0 0 3px #fff}.tl li::after{content:"";position:absolute;left:10.5px;top:18px;bottom:0;width:1px;background:var(--line)}.tl li:last-child::after{display:none}.tl li.done::before{background:#4f775b}.tl li.cur::before{background:var(--accent);box-shadow:0 0 0 4px rgba(154,109,87,.2)}.tl b{display:block;font-size:13.5px}.tl li:not(.done) b{color:var(--muted);font-weight:500}.tl time{font-size:12px;color:var(--muted)}
.paybadge{display:inline-flex;align-items:center;font-weight:800;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;letter-spacing:.02em}
.addrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.addr{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:6px}.addr.def{border-color:var(--ink)}.addr .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}.form .full{grid-column:1/-1}.form .chk{display:flex;align-items:center;gap:8px;color:var(--ink)}.form .chk input{min-height:0}
.err{color:#a8402f;background:#fbeeea;border-radius:10px;padding:9px 11px;font-size:12.5px}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 16px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.prov{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.prov:last-child{border-bottom:0}.prov svg{width:22px;height:22px}
.signin{max-width:460px;margin:60px auto;text-align:center}.signin h1{font:600 28px/1.2 Georgia,serif;margin:0 0 8px}.signin p{color:var(--muted);margin:0 0 22px}.signin .pa-opts{display:grid;gap:10px;text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;z-index:200;display:none}.toast.show{display:block}
.mcards{display:none}
.pa-none{color:var(--muted);font-size:13px;text-align:center}
@media(max-width:860px){.acct-out{grid-template-columns:minmax(0,1fr)!important}.acct-out>div,.acct-out .signin{margin-top:0!important}.signin{margin:20px auto}}
@media(max-width:860px){
 .top{height:auto;min-height:56px;padding:8px 12px;gap:8px}.logo{width:30px;height:30px;border-radius:10px;font-size:13px}.top .brand span.t{font-size:14px}
 .shell{grid-template-columns:minmax(0,1fr);margin:12px 12px 0;gap:12px}.side{min-width:0}
 .side{position:sticky;top:56px;z-index:40;padding:6px;border-radius:14px}.side .who{display:none}
 .nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a,.nav button{min-height:38px;padding:0 12px;font-size:13px}.nav svg{display:none}.nav .sep{display:none}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.grid2{grid-template-columns:1fr}.ph h1{font-size:24px}.card{padding:16px}
 .tblwrap.orders{display:none}.mcards{display:grid;gap:10px}.mcard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;display:grid;gap:8px;text-decoration:none;color:inherit}.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
 .form{grid-template-columns:1fr}.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}
}
</style><link rel="stylesheet" href="mobile.css"></head>
<body>
<div id="site-header" data-cart></div><script src="/header.js?v=1792772066"></script>
<div id="app" aria-live="polite"><div class="signin"><p class="muted">Loading…</p></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="i18n.js"></script>
<script src="account-auth.js"></script>
<script src="cart.js"></script>
<script src="account-app.js"></script>
<div id="site-footer"></div><script src="/footer.js" defer></script>
</body></html>
